[package]
name = "signal-near"
description = "Signal price oracle on NEAR: accepts only receipt verdicts signed by NEAR AI's attested model"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/southenempire/signal"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0", features = ["unstable"] }
serde_json = "1"
hex = "0.4"
bs58 = "0.5"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
