[package]
name = "signal_oracle"
version = "0.1.0"
description = "Signal Protocol: physical price oracle with on-chain consensus, locked rewards and slashing"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "signal_oracle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Pinned to match anchor-cli 1.1.2.
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"
